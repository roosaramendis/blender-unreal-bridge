# Push a tag like v0.16.0 and this builds the zips and publishes a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the zips
        run: bash build.sh "${GITHUB_REF_NAME}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.zip \
            --title "Blender → Unreal Bridge ${GITHUB_REF_NAME}" \
            --generate-notes
